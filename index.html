<!-- ============ PANTALLA DE INICIO DE SESIÓN ============ -->
<div id="login">
  <div class="lg-bg"></div>
  <div class="lg-center">
    <div class="lg-tile" id="lg-tile" tabindex="0" title="Haz clic para iniciar sesión">
      <svg viewBox="0 0 48 48"><use href="#i-user"/></svg>
    </div>
    <div class="lg-name">Mazapanycoca</div>
    <div class="lg-pw"><input type="password" value="aaaaaaaa" id="lg-pw" aria-label="Contraseña"><button id="lg-go" title="Iniciar sesión"><svg viewBox="0 0 16 16"><use href="#g-fwd"/></svg></button></div>
    <div class="lg-hint">Haz clic para iniciar sesión</div>
  </div>
  <div class="lg-foot"><b>Windows Vista</b><span>Home Premium</span></div>
  <div class="lg-welcome" id="lg-welcome">Bienvenido</div>
</div>

<!-- ============ ESCRITORIO ============ -->
<div id="desktop">
  <div id="icons"></div>
  <div id="sidebar"></div>
  <div id="wins"></div>
</div>

<!-- ============ BARRA DE TAREAS ============ -->
<div id="taskbar">
  <button id="orb" title="Iniciar"><svg viewBox="0 0 32 32"><use href="#i-flag"/></svg></button>
  <div id="quick">
    <button data-q="desktop" title="Mostrar escritorio"><svg viewBox="0 0 48 48"><use href="#i-desktop"/></svg></button>
    <button data-q="player" title="Reproductor MaZaPlayer"><svg viewBox="0 0 48 48"><use href="#i-player"/></svg></button>
    <button data-q="vis" title="Visualizador"><svg viewBox="0 0 48 48"><use href="#i-vis"/></svg></button>
  </div>
  <div id="tasks"></div>
  <div id="tray">
    <div id="tray-icons"></div>
    <div id="clock" title=""><span id="clk"></span></div>
  </div>
</div>

<!-- ============ MENÚ INICIO ============ -->
<div id="start" aria-hidden="true">
  <div class="st-cols">
    <div class="st-left">
      <div class="st-list" id="st-pinned"></div>
      <div class="st-sep"></div>
      <button class="st-all" id="st-all">Todos los programas <span>▸</span></button>
      <div class="st-allbox" id="st-allbox"></div>
      <div class="st-search"><svg viewBox="0 0 16 16"><use href="#g-search"/></svg><input id="st-q" placeholder="Iniciar búsqueda" autocomplete="off"></div>
    </div>
    <div class="st-right" id="st-right"></div>
  </div>
  <div class="st-foot">
    <button id="st-sleep" title="Apagar">⏻</button>
    <button id="st-logout">Cerrar sesión</button>
    <button id="st-off">Apagar</button>
  </div>
</div>

<div id="pop"></div>
<div id="shutdown"><div class="sd-msg" id="sd-msg"></div></div>

<script src="js/spectra.js"></script>
<script src="js/os.js"></script>
<script src="js/apps.js"></script>
</body>
</html>
